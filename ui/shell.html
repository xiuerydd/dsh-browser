  <div id="modal-backdrop" class="hidden">
    <section id="modal-settings" class="modal hidden" role="dialog" aria-label="设置">
      <header class="modal-head">
        <h2>设置</h2>
        <button class="modal-x" data-close="settings">✕</button>
      </header>
      <div class="modal-body">
        <fieldset>
          <legend>服务器</legend>
          <label class="row"><span>主机</span><input id="set-host" type="text" /></label>
          <label class="row"><span>端口</span><input id="set-port" type="number" min="1" max="65535" /></label>
          <label class="row"><span>自动启动服务</span><input id="set-autostart" type="checkbox" /></label>
          <label class="row"><span>启动命令</span><input id="set-command" type="text" placeholder="dsh" /></label>
          <label class="row"><span>工作目录</span><input id="set-workspace" type="text" /></label>
          <label class="row"><span>退出时停止服务</span><input id="set-stoponquit" type="checkbox" /></label>
          <label class="row"><span>额外允许的主机</span><input id="set-extrahosts" type="text" placeholder="逗号分隔，如 192.168.1.5" /></label>
        </fieldset>
        <fieldset>
          <legend>外观</legend>
          <label class="row"><span>界面主题</span>
            <select id="set-theme">
              <option value="follow">跟随 DeepSeek Harness（推荐）</option>
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </label>
        </fieldset>
        <fieldset>
          <legend>浏览</legend>
          <label class="row"><span>允许在应用内打开外部链接</span><input id="set-allowexternal" type="checkbox" /></label>
          <label class="row"><span>恢复上次的标签页</span><input id="set-restoretabs" type="checkbox" /></label>
        </fieldset>
        <fieldset>
          <legend>窗口</legend>
          <label class="row"><span>关闭时最小化到托盘</span><input id="set-closetotray" type="checkbox" /></label>
          <label class="row"><span>始终置顶</span><input id="set-alwaysontop" type="checkbox" /></label>
        </fieldset>
      </div>
      <footer class="modal-foot">
        <button class="btn ghost" id="btn-reset-settings">恢复默认</button>
        <span class="spacer"></span>
        <button class="btn ghost" data-close="settings">取消</button>
        <button class="btn primary" id="btn-save-settings">保存并应用</button>
      </footer>
    </section>

    <section id="modal-logs" class="modal hidden" role="dialog" aria-label="服务器日志">

        <button class="modal-x" data-close="logs">✕</button>
      </header>
      <div class="modal-body logs-body"><pre id="logs-view"></pre></div>
      <footer class="modal-foot">
        <button class="btn ghost" id="btn-clear-logs">清空</button>
        <span class="spacer"></span>
        <button class="btn primary" data-close="logs">关闭</button>
      </footer>
    </section>
